<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Love&Sex — Catálogo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/cta-final.css" />
</head>

<body>
  <!-- Hero Section -->
  <section class="hero">
    <video class="hero-video" autoplay muted loop playsinline preload="auto" poster="/hero/hero.jpg">
      <source src="/hero/hero.mp4" type="video/mp4">
    </video>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <!-- Contenido visual únicamente -->
    </div>
  </section>

  <section class="banner-info">
    <img src="/banners/banner-info.png" alt="Información de envíos, discreción y políticas Love&Sex">
  </section>

  <section id="packs-destacados"></section>

  <section id="packs-destacados"></section>

  <section class="catalogo-banner">
    <video class="banner-video" autoplay muted loop playsinline preload="metadata">
      <source src="/banners/catalogo-banner.mp4" type="video/mp4">
    </video>
  </section>

  <div id="categorias-container" class="categorias-container"></div>

  <div id="btn-volver-categorias" class="btn-volver-categorias" style="display:none;">
    <button onclick="volverCategorias()" class="btn-volver">
      ← Ver todas las categorías
    </button>
  </div>

  <div id="filtros" class="filtros-container" style="display:none;">
    <div class="filtros-wrapper">
      <div class="filtro-item">
        <select id="categoria" class="filtro-select">
          <option value="">📂 Todas las categorías</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Modal de Vista Rápida -->
  <div id="modal-overlay" class="modal-overlay" style="display:none;">
    <div class="modal-contenido">
      <button class="modal-cerrar" id="modal-cerrar">✕</button>
      <div class="modal-body">
        <div class="modal-imagen">
          <img id="modal-img" src="" alt="Producto" />
        </div>
        <div class="modal-info">
          <h2 id="modal-nombre"></h2>
          <p class="modal-categoria" id="modal-categoria"></p>
          <p class="modal-precio"><strong id="modal-precio"></strong></p>
          <p id="modal-description" class="modal-description"></p>
          <a id="modal-whatsapp" class="modal-whatsapp" target="_blank">
            Pedir ahora
          </a>
        </div>
      </div>
    </div>
  </div>



  <footer class="footer">
    <div class="footer-container">
      <div class="footer-brand">
        <h2 class="footer-logo-text">Love&Sex</h2>
      </div>
      <div class="footer-info">
        <p class="footer-slogan">"Tu Placer, Mi Satisfacción"</p>
        <p class="footer-copyright">&copy; 2026 Love&Sex. Todos los derechos reservados.</p>
      </div>
    </div>
  </footer>

  <script src="/js/app.js"></script>
</body>

</html>
